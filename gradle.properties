android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Deployment values baked into BuildConfig. Defaults only — put real/secret values in
# local.properties (git-ignored), which overrides these. beatblox.hubKey is the Coreworkbench
# per-app API key (cwb_...); empty = feedback stays in the on-device outbox.
beatblox.hubUrl=https://coreworkbench.com
beatblox.hubKey=
beatblox.sourceUrl=https://github.com/okan-sourcerer/beatblox
beatblox.downloadUrl=
