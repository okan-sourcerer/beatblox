android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Deployment values baked into BuildConfig (override with -P or in ~/.gradle/gradle.properties).
# strudel.hubKey: the Coreworkbench per-app API key (cwb_...). Empty = feedback stays in the
# on-device outbox until a build with the key ships. Keep the real key in ~/.gradle/gradle.properties.
strudel.hubUrl=https://coreworkbench.com
strudel.hubKey=
strudel.sourceUrl=https://github.com/okan-sourcerer/beatblox
strudel.downloadUrl=
